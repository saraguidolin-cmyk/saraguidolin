<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sara Guidolin — Portfolio</title>

    <style>
        body {
            margin: 0;
            background: #f5f2ed;
            color: #1d1d1d;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 80px 25px;
        }

        h1 {
            font-size: 48px;
            font-weight: 400;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 18px;
            margin-bottom: 50px;
        }

        .portfolio {
            width: 100%;
            height: 800px;
            border: none;
            background: white;
        }

        a {
            display: inline-block;
            margin-top: 30px;
            padding: 14px 25px;
            background: #1d1d1d;
            color: white;
            text-decoration: none;
        }

        a:hover {
            opacity: 0.75;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Sara Guidolin</h1>

        <div class="subtitle">
            Musician · Composer · Improviser
        </div>

        <iframe
            class="portfolio"
            src="portfolio.pdf">
        </iframe>

        <a href="portfolio.pdf" target="_blank">
            Open portfolio PDF
        </a>

    </div>

</body>
</html>
